<div id="myModal" >
  <span onclick="closeModal()" style="color:white; font-size:40px; cursor:pointer; position:absolute; top:10px; right:30px;">&times; Close</span><br>
  <img id="modalImage" src="male.jpg" width="700" style="border-radius:10px;">
  <br><br>
  <button onclick="prevImage()">Previous</button>
  <button onclick="nextImage()">Next </button>
</div>

<script>



var images = ["a.jpg","b.jpg","c.jpg","c.jpg","maliba.jpg","lehloa.jpg","male.jpg"];
var current = 0;

function showImage(src) {
  document.getElementById("mainImage").src = src;
  for (var i = 0; i < images.length; i++) {
    if (images[i] == src) { current = i; }
  }
}
function nextImage() {
  current = current + 1;
  if (current >= images.length) { current = 0; }
  document.getElementById("mainImage").src = images[current];
  document.getElementById("modalImage").src = images[current];
}
function prevImage() {
  current = current - 1;
  if (current < 0) { current = images.length - 1; }
  document.getElementById("mainImage").src = images[current];
  document.getElementById("modalImage").src = images[current];
}
function openModal() {
  document.getElementById("modalImage").src = document.getElementById("mainImage").src;
  document.getElementById("myModal").style.display = "block";
}
function closeModal() {
  document.getElementById("myModal").style.display = "none";
}



</script>
